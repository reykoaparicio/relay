name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # Flags go straight after the script name: pnpm forwards a literal `--`, which Vitest would ignore.
      - run: pnpm test:unit --coverage
      - run: pnpm test:integration
      - name: API doc drift check (R2-36)
        if: hashFiles('packages/contracts/src/scripts/gen-api-doc.ts') != ''
        run: |
          pnpm gen:api-doc
          git diff --exit-code docs/architecture/ipc-api.md

  e2e:
    needs: check
    runs-on: macos-14
    env:
      RELAY_PROVIDER_MODE: fake
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # F2 audit fix: skip until the E2E suite (plan 12) and the Electron app (plan 08) exist.
      - name: Detect E2E suite
        id: e2e
        run: |
          if [ -f playwright.config.ts ] && [ -f apps/desktop/electron.vite.config.ts ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "ready=false" >> "$GITHUB_OUTPUT"; fi
      # Electron 44 downloads its binary on first use; fetch it up front so the Playwright launch doesn't time out.
      - name: Fetch Electron binary
        if: steps.e2e.outputs.ready == 'true'
        run: pnpm --filter @relay/desktop exec electron --version
      - run: pnpm e2e
        if: steps.e2e.outputs.ready == 'true'
      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  audit:
    runs-on: ubuntu-latest
    continue-on-error: true # non-blocking (00b §6)
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: pnpm audit --prod --audit-level high
