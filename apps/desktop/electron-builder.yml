# 08 H9 packaging (electron-builder 26). Everything is bundled into out/**; only the sample project ships beside it.
appId: dev.relay.prototype
productName: Relay
directories:
  output: dist
  buildResources: resources
files:
  - "out/**/*"
  - "package.json"
extraResources:
  # Bundled sample (§4.1); the fixture .env is never shipped.
  - from: "../../tests/fixtures/sample-api"
    to: "sample-api"
    filter: ["**/*", "!.env", "!**/.env"]
asar: true
mac:
  target:
    - target: dir
      arch: arm64
    - target: dmg
      arch: arm64
  category: public.app-category.developer-tools
  hardenedRuntime: false
  # Ad-hoc signature: arm64 macOS refuses to run unsigned code (§18.1). VERIFY with `codesign -dv` (13 §M1).
  identity: "-"
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  # Stays ENABLED (Electron's default), set explicitly so it is a decision, not an omission (08 H9). The renderer is
  # loaded from file://…/out/renderer/index.html, and Vite emits `<script type="module" crossorigin>` and
  # `<link rel="stylesheet" crossorigin>`. Without this fuse Chromium treats file:// as origin `null` and blocks those
  # module/CORS loads ("Cross origin requests are only supported for protocol schemes: … http, https"): the window
  # stays blank. Verified 2026-10-01 by flipping only this fuse on a copy of the Electron 44.5.1 binary and launching
  # the built app (fuse on: renderer mounts; fuse off: index.js and index.css blocked by CORS, #root empty).
  # Disabling it requires serving the renderer from a privileged custom protocol (protocol.handle) instead of file://.
  grantFileProtocolExtraPrivileges: true
